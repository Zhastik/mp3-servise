services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://volna:${POSTGRES_PASSWORD:?Run scripts/configure_docker.py and use --env-file .env.docker}@db:5432/volna
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_CREATE_TABLES: "false"
      TRACK_ENCRYPTION_KEY: ${TRACK_ENCRYPTION_KEY:?Run scripts/configure_docker.py and use --env-file .env.docker}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - tracks:/app/media/tracks
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: volna
      POSTGRES_DB: volna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_docker.py and use --env-file .env.docker}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volna -d volna"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped
volumes:
  tracks:
  postgres:
  clamav:
